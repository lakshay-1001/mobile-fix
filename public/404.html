<!doctype html>
<html lang="en-AE">

    <title>Page Not Found | Azan Mobile Fix</title>

      * { box-sizing: border-box; }

      .code { color: #b7004f; font-weight: 800; }
      h1 { margin: 12px 0; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.05; }
      p { margin: 0 auto; max-width: 560px; color: #5a4045; line-height: 1.7; }
      a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 28px; padding: 0 28px; border-radius: 999px; background: #b7004f; color: white; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 2px solid #b7004f; outline-offset: 3px; }
    </style>

    <main>
      <div class="code">404</div>
